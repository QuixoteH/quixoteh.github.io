[[items]]
title = "YOLOv8 and IoT Agricultural Pest Detection System"
badge = "Undergraduate Thesis"
role = "Embedded sensing, live video, and YOLOv8 pest detection"
organization = "Northeast Agricultural University"
date = "01/2026"
visuals = ["STM32 + ESP32-CAM", "YOLOv8x · IP102"]
content = """
- **Background:** Field pest outbreaks depend on temperature and are hard to monitor continuously and cheaply, so this undergraduate thesis combines IoT sensing with vision-based detection.
- **Task:** Design a system that senses the environment, streams field video, detects pests in real time, and alerts users automatically.
- **Action:** Built STM32F103C8T6 firmware with DHT22 sensing, an accumulated-temperature algorithm, and SMS alerts. Streamed video from an ESP32 module to a host computer, preprocessed it with OpenCV, and fine-tuned YOLOv8x on IP102 with a PyQt5 and SQLite interface.
- **Result:** Delivered a working end-to-end system covering sensing, outbreak alerts, live video, and real-time pest detection with recorded results.
- **Reflection:** The smaller YOLOv8s model did not perform well enough, so we moved to YOLOv8x. The project showed that embedded hardware, video streaming, and the model must be designed together as one system.
"""

