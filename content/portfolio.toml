[[items]]
title = "MSM-Seg: Cross-Modal 3D Brain Tumor Segmentation"
badge = "IEEE Transactions on Multimedia"
role = "Comparative 3D segmentation experiments supporting the MSM-Seg framework"
organization = "Collaborative research"
date = "03/2025"
images = [
  "/research/msm-seg-method.png"
]
content = """
- **Background:** MSM-Seg is a modality-and-slice memory framework with category-agnostic prompting for multi-modal brain tumor segmentation.
- **Task:** Provide the comparative experiments that show how MSM-Seg stands against existing 3D segmentation methods.
- **Action:** Trained and evaluated nnU-Net, 3D-TransUNet, TransBTS, SIN2GR, UNETR++, and other models on BraTS 2024 and BraTS 2025 under a standardized protocol, measuring Dice and HD95 for the ET, TC, and WT sub-regions.
- **Result:** MSM-Seg outperformed or matched all baselines, particularly under the category-agnostic prompting setting, and the work was published in *IEEE Transactions on Multimedia*.
- **Reflection:** Fair comparison needs one shared evaluation protocol and the same data splits for every method, otherwise differences in the numbers cannot be trusted.
"""

