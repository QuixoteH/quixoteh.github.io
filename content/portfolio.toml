[[items]]
title = "SO-101 Real-World Robotic Learning with LeRobot"
badge = "Real-Robot Deployment"
role = "End-to-end imitation learning on the Huaner SO-101 dual-arm platform"
organization = "LeRobot · SmolVLA"
date = "07/2026"
images = [
  "/research/so101-real-robot-demo.gif"
]
content = """
- **Background:** The Huaner SO-101 is a low-cost dual-arm platform, and LeRobot provides an open pipeline for real-robot imitation learning.
- **Task:** Reproduce an end-to-end pipeline on real hardware, from teleoperation data collection to policy training and on-robot deployment.
- **Action:** Collected teleoperated demonstrations, trained a SmolVLA policy, and modified the source to support RGB multi-view perception and language-conditioned manipulation. Debugged hardware setup, camera calibration, and inference failures along the way.
- **Result:** Achieved real-robot policy inference on the SO-101, with a demo video and a full reproduction record published in the repository.
- **Reflection:** Reproduction should go layer by layer: device safety, static data checks, a 200-step smoke test, checkpoint loading, then fixed-start real-robot evaluation. A failure at any layer should be fixed there, not hidden by longer training or more data.
"""

