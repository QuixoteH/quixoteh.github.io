[[items]]
title = "MSM-Seg: Cross-Modal 3D Brain Tumor Segmentation"
badge = "IEEE Transactions on Multimedia"
role = "Comparative 3D segmentation experiments supporting the MSM-Seg framework"
organization = "Collaborative research"
date = "03/2025"
images = [
  "/research/msm-seg-method.png"
]
content = """
- **Background:** MSM-Seg is a modality-and-slice memory framework with category-agnostic prompting for multi-modal brain tumor segmentation, which needs a fair comparison against strong 3D baselines.
- **Task:** Provide the comparative experiments that place MSM-Seg against existing methods on the BraTS 2024 and BraTS 2025 datasets.
- **Action:** Trained and evaluated more than five baselines (nnU-Net, 3D-TransUNet, TransBTS, SIN2GR, UNETR++, and others) under one standardized BraTS-METS protocol, measuring Dice and HD95 on the ET, TC, and WT sub-regions.
- **Result:** MSM-Seg outperformed or matched all baselines, especially under the category-agnostic prompting setting, and the work was published in *IEEE Transactions on Multimedia*.
- **Review:** Comparisons are only trustworthy with the same data splits and metrics for every method. Next time I would record per-sub-region numbers and variance across runs from the start, so claims rest on data rather than a single run.
"""

