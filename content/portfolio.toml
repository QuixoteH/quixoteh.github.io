[[items]]
title = "SO-101 Real-World Robotic Learning with LeRobot"
badge = "Real-Robot Deployment"
role = "End-to-end imitation learning on the Huaner SO-101 dual-arm platform"
organization = "LeRobot · SmolVLA"
date = "07/2026"
images = [
  "/research/so101-real-robot-demo.gif"
]
content = """
- I collected **90** teleoperated SO-101 episodes (17,778 frames at 20 Hz) covering two block colors and three lighting conditions.
- I fine-tuned a language-conditioned SmolVLA policy to place a small green or purple block on a plate from dual-camera images.
- I trained it for **25,000** steps with source changes for multi-view RGB input, and debugged calibration and inference failures on the real robot.
- The green-task 10k checkpoint succeeded in **9/10** consecutive demonstrations, while the purple task reached **5/10** at both 10k and 20k steps.
- Purple did not improve with longer training, which points to data or interface limits, so I would run independent randomized-reset trials next.
"""

