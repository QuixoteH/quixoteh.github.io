[[items]]
title = "SO-101 Real-World Robotic Learning with LeRobot"
badge = "Real-Robot Deployment"
role = "End-to-end imitation learning on the Huaner SO-101 dual-arm platform"
organization = "LeRobot · SmolVLA"
date = "07/2026"
images = [
  "/research/so101-real-robot-demo.gif"
]
content = """
- **Background:** The Huaner SO-101 is a low-cost dual-arm platform, and LeRobot offers an open pipeline for real-robot imitation learning. The real dataset has **90** episodes and **17,778** frames at 20 Hz, with two colors, three lighting conditions, and two cameras.
- **Task:** Reproduce the full pipeline on real hardware, from teleoperated data collection to policy training and deployment, and judge it by real task success rather than training loss.
- **Action:** Collected the teleoperated demonstrations, ran a 200-step smoke test, then trained a SmolVLA baseline for **25,000** steps (batch size 8). Modified the source to support RGB multi-view perception and language-conditioned manipulation, and fixed hardware, camera-calibration, and inference failures. Kept the collection (LeRobot 0.3.4) and training (0.5.1) environments separate.
- **Result:** The green-task 10k checkpoint succeeded in **9/10** consecutive demonstrations, while the purple task reached **5/10** at both 10k and 20k steps. The 9/10 is a consecutive demonstration, not an independent randomized-reset test.
- **Review:** Purple did not improve from 10k to 20k steps, so the limit was in the data or interface rather than training length. Next time I would run independent randomized-reset trials and check each layer in order (device safety, data, smoke test, checkpoint loading, real evaluation) instead of training longer.
"""

