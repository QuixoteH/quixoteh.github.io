[[items]]
title = "SO-101 Real-World Robotic Learning with LeRobot"
badge = "Real-Robot Deployment"
role = "Real-world imitation learning"
organization = "LeRobot · SmolVLA"
date = "07/2026"
images = [
  "/research/so101-real-robot-demo.gif"
]
content = """
- Collected **90** teleoperated episodes (17,778 frames at 20 Hz) with dual cameras across two block colors and three lighting conditions on the Huaner SO-101 arm.
- Fine-tuned a language-conditioned SmolVLA policy for **25,000** steps with LeRobot, modifying the source for multi-view RGB input and debugging calibration and inference failures.
- Reached **9/10** on consecutive real-robot demonstrations for the green block, while the purple block stayed at **5/10** at both 10k and 20k steps.
"""

