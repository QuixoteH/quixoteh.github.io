[[items]]
title = "MSM-Seg: Cross-Modal 3D Brain Tumor Segmentation"
badge = "IEEE Transactions on Multimedia"
role = "Comparative 3D segmentation experiments supporting the MSM-Seg framework"
organization = "Collaborative research"
date = "03/2025"
images = [
  "/research/msm-seg-method.png"
]
content = """
- MSM-Seg is a modality-and-slice memory framework with category-agnostic prompting for multi-modal 3D brain tumor segmentation, published in *IEEE Transactions on Multimedia*.
- I ran the baseline comparisons on the BraTS-METS and BraTS-AGPT datasets from BraTS 2024.
- I reimplemented nnU-Net, 3D-TransUNet, TransBTS, SIN2GR, UNETR++, and other baselines under one training setting and measured Dice and HD95 on ET, TC, and WT.
- With category-agnostic prompts, MSM-Seg reached **79.51%** and **83.84%** average Dice, beating SAM-Med3D by 2.04% and 1.36%.
- The comparison is fair only when every method shares one training setting, and the weak-boundary and tiny-lesion failure cases show where to improve next.
"""

