[[items]]
title = "YOLOv8 and IoT Agricultural Pest Detection System"
badge = "Undergraduate Thesis"
role = "Embedded sensing, live video, and YOLOv8 pest detection"
organization = "Northeast Agricultural University"
date = "01/2026"
visuals = ["STM32 + ESP32-CAM", "YOLOv8x · IP102"]
content = """
- **Background:** Pest outbreaks depend on accumulated temperature and are hard to monitor continuously and cheaply in the field, so this undergraduate thesis combines IoT sensing with vision-based detection on the **102**-class IP102 dataset.
- **Task:** Build a system that samples the environment, streams field video, detects pests in real time, and sends automatic alerts, running on low-cost embedded hardware.
- **Action:** Wrote STM32F103C8T6 firmware with 5-second DHT22 sampling, a 24-hour accumulated-temperature settlement stored in EEPROM, and SMS alerts. Streamed video from the ESP32 module to a host computer, preprocessed it with OpenCV, and used a three-thread PyQt5 and SQLite application. Chose YOLOv8x over YOLOv8s because the smaller model performed poorly.
- **Result:** Delivered a working end-to-end system covering sensing, outbreak alerts, live video, and real-time detection with recorded results.
- **Review:** Moving to YOLOv8x traded inference cost for accuracy, and the project showed that firmware, video transport, and the model have to be designed together. Next time I would measure detection accuracy and end-to-end latency in the field from the start.
"""

