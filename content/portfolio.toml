[[items]]
title = "YOLOv8 and IoT Agricultural Pest Detection System"
badge = "Undergraduate Thesis"
role = "Embedded sensing, live video, and YOLOv8 pest detection"
organization = "Northeast Agricultural University"
date = "01/2026"
visuals = ["STM32 + ESP32-CAM", "YOLOv8x · IP102"]
content = """
- Pest outbreaks depend on accumulated temperature, so my thesis pairs low-cost IoT sensing with vision-based detection on a 7-class IP102 subset.
- I aimed for a system that samples the environment, streams field video, detects pests in real time, and sends SMS alerts, at 10 fps and over 80% recognition accuracy.
- I wrote STM32 firmware for 5-second DHT22 sampling, accumulated-temperature alerts, and ESP32 video streaming, then fine-tuned YOLOv8x inside a PyQt5 application with SQLite logging.
- The YOLOv8x model reached **0.793** mAP@0.5, with precision 0.723 and recall 0.815.
- YOLOv8s performed poorly, so I moved to YOLOv8x at a higher inference cost, and next time I would measure end-to-end field latency from the start.
"""

