[[items]]
title = "RoboSynChallenge @ NeurIPS 2026"
badge = "23rd · Preliminary Stage"
role = "Embodied-AI competition, Team LBWSquare"
organization = "RoboSynChallenge Organizing Committee"
date = "10/2026"
visuals = ["23rd", "Preliminary Stage"]
content = """
- **Background:** RoboSynChallenge is a NeurIPS 2026 embodied-AI competition with 10 simulated manipulation tasks, scored by success rate, action efficiency, and inference efficiency.
- **Task:** As Team LBWSquare, maximize the overall score with a single submission covering all 10 tasks, evaluated once on hidden held-out parameters with no leaderboard feedback.
- **Action:** Selected per task among the official released **ACT**, **Diffusion Policy**, and **SmolVLA** checkpoints behind one unified adapter, trained a **pi0.5** policy for the handle-basket task, fine-tuned released checkpoints with extra perturbed simulation data, and tuned inference settings such as the replanning interval.
- **Result:** Ranked **23rd** in the preliminary stage, missing the final round by only **2 places** (21 teams qualified). Tuning the replanning interval raised water-pouring success from 50% to 85%.
- **Reflection:** The small released policies were brittle under scene perturbations, handover and sample loading stayed near zero, and fine-tuning or temporal ensembling often brought no gain. With only small paired local tests to guide decisions, we will keep learning and come back stronger.
"""

