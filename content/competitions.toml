[[items]]
title = "RoboSynChallenge @ NeurIPS 2026"
badge = "23rd · Preliminary Stage"
role = "Embodied-AI competition, Team LBWSquare"
organization = "RoboSynChallenge Organizing Committee"
date = "10/2026"
images = [
  "/competitions/robosyn-tasks.jpg"
]
content = """
- RoboSynChallenge @ NeurIPS 2026 scores 10 simulated manipulation tasks by success rate (75%), action efficiency (20%), and inference efficiency (5%).
- Our team, LBWSquare, had to submit one policy set that would be judged once on hidden held-out parameters, with no leaderboard feedback.
- For each task we started from the best official ACT, Diffusion Policy, or SmolVLA checkpoint and swapped it only when pi0.5, fine-tuning, or replanning tuning won paired same-seed tests.
- We ranked **23rd** in the preliminary stage, just **2 places** short of the 21 qualifiers, after lifting handle-basket success from 35% to 90%.
- We learned that perturbation tests should come before model selection and that the job queue needs planning, since our GPU sat idle for about 19 hours.
"""

