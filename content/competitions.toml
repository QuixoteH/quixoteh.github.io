[[items]]
title = "Marso Hack Berlin 2026 – Robot Parcel Sorting Challenge"
badge = "Not Submitted · Reproduction Study"
role = "Post-deadline reproduction and experiments (no official submission)"
organization = "Marso Robotics"
date = "07/2026"
images = [
  "/competitions/marso-easy-demo.gif",
  "/competitions/marso-dp-results.png"
]
content = """
- Built State Diffusion Policy and RGB ACT training and evaluation pipelines for color-matched parcel sorting with a Franka Panda robot in ManiSkill3 and SAPIEN.
- Evaluated State Diffusion Policy across Easy, Medium, and Hard settings over fixed 50-episode runs, obtaining local sort accuracies of **0.390**, **0.090**, and **0.103**.
- Completed 30,000 offline updates for the Easy RGB ACT policy and verified checkpoint loading and submission packaging.
"""

