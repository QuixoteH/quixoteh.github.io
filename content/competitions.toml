[[items]]
title = "RoboSynChallenge @ NeurIPS 2026"
badge = "23rd · Preliminary Stage"
role = "Embodied-AI competition, Team LBWSquare"
organization = "RoboSynChallenge Organizing Committee"
date = "10/2026"
visuals = ["23rd", "Preliminary Stage"]
content = """
- **Background:** RoboSynChallenge is a NeurIPS 2026 embodied-AI competition with **10** simulated manipulation tasks. Scoring weights success rate at 75%, action efficiency at 20%, and inference efficiency at 5%, and the preliminary-round cutoff turned out to be 35 points.
- **Task:** As Team LBWSquare, maximize the overall score with one submission covering all 10 tasks, judged once on hidden held-out parameters (different seeds, lighting, and camera views) with no leaderboard feedback.
- **Action:** Started from the best official **ACT**, **Diffusion Policy**, or **SmolVLA** checkpoint per task (estimated baseline: 54.5% mean success rate, about 46.6 points) and replaced a model only when it won paired same-seed tests in both normal and perturbed scenes. Trained **pi0.5** for handle-basket, fine-tuned released models with extra perturbed simulation data, and tuned replanning intervals. Dropped pi0.5 on drawer, pipette, assembly, and handover (for example drawer 0/10 vs 5/10), and dropped temporal ensembling (mixer 1/10 vs 8/10).
- **Result:** Ranked **23rd** in the preliminary stage; **21** teams qualified, so we missed the final by only **2 places**. Handle-basket success rose from 35% to 90% (20 episodes), water pouring from 10/20 to 17/20 after replanning, and items handover from 6/30 to 22/30 after SmolVLA replanning.
- **Review:** We only found which tasks collapsed under perturbation after the baseline was in place, so next time the perturbation test comes first and drives model selection. Our GPU also sat idle for about 19 hours because no follow-up jobs were queued, so next time the job queue is planned ahead. We will keep learning and come back stronger.
"""

