[[items]]
title = "RoboSynChallenge @ NeurIPS 2026"
badge = "23rd · Preliminary Stage"
role = "Embodied-AI competition, Team LBWSquare"
organization = "RoboSynChallenge Organizing Committee"
date = "10/2026"
visuals = ["23rd", "Preliminary Stage"]
content = """
- **Background:** RoboSynChallenge @ NeurIPS 2026 scores 10 simulated manipulation tasks by success rate (75%), action efficiency (20%), and inference efficiency (5%).
- **Task:** As Team LBWSquare, maximize the score of one 10-task submission that is judged once on hidden held-out parameters, with no leaderboard feedback.
- **Action:** Picked the best official ACT, Diffusion Policy, or SmolVLA checkpoint per task and replaced it only after winning paired same-seed tests, using pi0.5, fine-tuning, and replanning tuning.
- **Result:** Ranked **23rd** in the preliminary stage, only **2 places** short of the 21 qualifiers, with handle-basket success rising from 35% to 90%.
- **Review:** Perturbation tests should come before model selection, and the job queue should be planned ahead, since our GPU sat idle for about 19 hours.
"""

