[[items]]
title = "Marso Hack Berlin 2026 – Robot Parcel Sorting Challenge"
badge = "Reproduction Study"
role = "Imitation-learning reproduction and experiments for simulated parcel sorting"
organization = "Marso Robotics"
date = "07/2026"
images = [
  "/competitions/marso-easy-demo.gif",
  "/competitions/marso-dp-results.png"
]
content = """
- Marso Hack Berlin 2026 asks a Franka Panda to sort color-matched parcels in ManiSkill3, with Easy, Medium, and Hard settings weighted 0.20, 0.30, and 0.50.
- I set out to reproduce State Diffusion Policy and RGB ACT baselines and compare them under one fixed evaluation protocol.
- I built both pipelines, evaluated State Diffusion Policy over fixed 50-episode runs, and trained the Easy RGB ACT policy for 30,000 offline updates.
- State Diffusion Policy reached sort accuracies of **0.390**, **0.090**, and **0.103** on Easy, Medium, and Hard, a weighted score of **0.1565**.
- Hard carries half the weight but scored lowest, so next time I would target it first and judge ACT by closed-loop results rather than offline loss.
"""

