[[items]]
title = "Marso Hack Berlin 2026 – Robot Parcel Sorting Challenge"
badge = "Reproduction Study"
role = "Imitation-learning reproduction and experiments for simulated parcel sorting"
organization = "Marso Robotics"
date = "07/2026"
images = [
  "/competitions/marso-easy-demo.gif",
  "/competitions/marso-dp-results.png"
]
content = """
- **Background:** Marso Hack Berlin 2026 asked for color-matched parcel sorting with a Franka Panda robot in ManiSkill3 and SAPIEN.
- **Task:** Reproduce imitation-learning baselines for the challenge to study how they behave across the Easy, Medium, and Hard settings.
- **Action:** Built State Diffusion Policy and RGB ACT training and evaluation pipelines, evaluated State Diffusion Policy over fixed 50-episode runs per setting, and trained the Easy RGB ACT policy for 30,000 offline updates.
- **Result:** Local sort accuracies for State Diffusion Policy were **0.390** (Easy), **0.090** (Medium), and **0.103** (Hard). Checkpoint loading and submission packaging were verified.
- **Reflection:** Accuracy dropped sharply from Easy to Medium and Hard, which shows that generalizing across settings, not fitting a single setting, is the real difficulty of this task.
"""

