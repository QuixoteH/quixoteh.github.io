[[items]]
title = "Marso Hack Berlin 2026 – Robot Parcel Sorting Challenge"
badge = "Reproduction Study"
role = "Imitation-learning reproduction and experiments for simulated parcel sorting"
organization = "Marso Robotics"
date = "07/2026"
images = [
  "/competitions/marso-easy-demo.gif",
  "/competitions/marso-dp-results.png"
]
content = """
- **Background:** Marso Hack Berlin 2026 asks a Franka Panda to sort color-matched parcels in ManiSkill3, with Easy, Medium, and Hard settings weighted 0.20, 0.30, and 0.50.
- **Task:** Reproduce State Diffusion Policy and RGB ACT baselines and compare them under one fixed evaluation protocol.
- **Action:** Built both pipelines, evaluated State Diffusion Policy over fixed 50-episode runs, and trained the Easy RGB ACT policy for 30,000 offline updates.
- **Result:** Local sort accuracies were **0.390**, **0.090**, and **0.103** on Easy, Medium, and Hard, a weighted score of **0.1565**.
- **Review:** Hard carries half the weight but scored lowest, so future effort should target Hard first and judge ACT by closed-loop results rather than offline loss.
"""

