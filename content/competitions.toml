[[items]]
title = "Marso Hack Berlin 2026 – Robot Parcel Sorting Challenge"
badge = "Reproduction Study"
role = "Imitation-learning reproduction and experiments for simulated parcel sorting"
organization = "Marso Robotics"
date = "07/2026"
images = [
  "/competitions/marso-easy-demo.gif",
  "/competitions/marso-dp-results.png"
]
content = """
- **Background:** Marso Hack Berlin 2026 asked for color-matched parcel sorting with a Franka Panda in ManiSkill3 and SAPIEN, in three settings: Easy (2 parcels), Medium (4), and Hard (6, with bins that may swap). The score weights are 0.20, 0.30, and 0.50.
- **Task:** Reproduce State Diffusion Policy and RGB ACT baselines and measure them with a fixed protocol across all three settings.
- **Action:** Built both training and evaluation pipelines and evaluated State Diffusion Policy on fixed seeds 5000-5049 (50 episodes per setting) so candidates could be compared fairly. Trained the Easy RGB ACT policy for 30,000 offline updates and verified checkpoint loading and the 195 MiB submission package.
- **Result:** State Diffusion Policy reached sort accuracies of **0.390**, **0.090**, and **0.103** on Easy, Medium, and Hard, a weighted local score of **0.1565**. These are local fixed-seed results, not a held-out leaderboard score.
- **Review:** Hard carries half of the weight but scored only 0.103, so effort on the Hard setting would raise the weighted score the most. Next time I would evaluate Hard early and use closed-loop RGB results, not only offline loss, to judge the ACT policy.
"""

